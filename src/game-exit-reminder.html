<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 종료 안내</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/game-exit-reminder.css">
    <script src="assets/tailwind.min.js"></script>
    <script src="assets/lucide.min.js"></script>
</head>
<body>
    <div class="panel-glass">
        <div class="header-bg">
            <div class="icon-box"><i data-lucide="log-out"></i></div>
            <h1 class="text-xl font-black tracking-tight">게임 종료 안내</h1>
        </div>
        <div class="content-area">
            <div class="message-box custom-scroll"><div id="reminder-message" class="message-text">잠시만 기다려주세요...</div></div>
            <div id="incomplete-section" class="incomplete-section hidden">
                <div class="section-label"><i data-lucide="list-checks" class="w-4 h-4"></i>프로필별 남은 숙제</div>
                <div id="profile-tabs" class="profile-tabs custom-scroll" role="tablist" aria-label="숙제를 확인할 프로필"></div>
                <div id="profile-tasks" class="profile-tasks" role="tabpanel" tabindex="0">
                    <p id="profile-summary" class="profile-summary" role="status"></p>
                    <div id="task-scroll" class="scroll-area custom-scroll">
                        <div id="incomplete-list" class="tag-container"></div>
                        <p id="incomplete-empty" class="incomplete-empty" hidden></p>
                    </div>
                </div>
            </div>
            <button id="confirm-reminder" type="button" class="btn-confirm no-drag">확인했습니다</button>
        </div>
    </div>
    <script src="assets/ui-utils.js"></script>
    <script src="renderer/game-exit-reminder.js"></script>
</body>
</html>
